# Render Blueprint: one Docker web service + managed Postgres.
services:
  - type: web
    name: voice-ai-patient-registration
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: patient-registration-db
          property: connectionString
      - key: VAPI_WEBHOOK_SECRET
        generateValue: true
databases:
  - name: patient-registration-db
    plan: free
