# Render's free tier sleeps after 15 min idle; ping /health so calls never hit a cold start.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --max-time 60 "${{ vars.PUBLIC_BASE_URL }}/health"
